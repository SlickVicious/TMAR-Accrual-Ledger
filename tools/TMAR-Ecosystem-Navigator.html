<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TMAR Ecosystem Navigator</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Cobalt Peacock — the vault's own established identity (VaultIndex.md, .obsidian theme),
       extended into a full token system rather than reinvented. */
    --bg: #090b13;
    --bg-elevated: #0e111c;
    --surface: #141828;
    --surface-hover: #1a2036;
    --border: rgba(154, 147, 216, 0.14);
    --border-bright: rgba(154, 147, 216, 0.32);
    --violet: #6946b9;
    --violet-bright: #9575e0;
    --violet-dim: #3d2a6b;
    --teal: #2dd4bf;
    --gold: #d4a72c;
    --danger: #e08a8a;
    --text: #e8e5f5;
    --text-dim: #a29bc4;
    --text-faint: #6b6690;
    --mono: #7fd8cc;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Rubik', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header: instrument-panel strip, not a marketing hero ─────── */
  header {
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand .mark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.01em;
    background: linear-gradient(120deg, var(--violet-bright), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .brand .sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }

  .status-strip {
    display: flex;
    gap: 16px;
    margin-left: auto;
    flex-wrap: wrap;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.hub { background: var(--violet-bright); box-shadow: 0 0 6px var(--violet-bright); }
  .status-dot.record { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .status-dot.proxy { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .status-dot.vault { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

  /* ── Body: left rail + main ─────────────────────────────────── */
  .body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  nav.rail {
    width: 230px;
    flex-shrink: 0;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 10px 0;
  }

  .rail-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 18px;
    background: transparent;
    border: none;
    border-left: 2px solid transparent;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
  }

  .rail-btn .glyph { font-size: 15px; flex-shrink: 0; width: 18px; text-align: center; }

  .rail-btn:hover { background: var(--surface); color: var(--text); }

  .rail-btn.active {
    background: var(--surface);
    color: var(--text);
    border-left-color: var(--violet-bright);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px 60px;
  }

  .panel { display: none; }
  .panel.active { display: block; animation: fadein 0.18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .panel h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .panel .desc {
    color: var(--text-dim);
    font-size: 13.5px;
    max-width: 780px;
    margin-bottom: 20px;
    line-height: 1.55;
  }

  .diagram-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 18px;
    overflow-x: auto;
  }

  .diagram-card .diagram-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }

  .diagram-card .mermaid { display: flex; justify-content: center; }

  /* ── Linked files panel — always shows this tab's files; clicking ── */
  /* a diagram node filters it to that node, it never starts empty.   */
  .files-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .files-panel .files-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .files-panel .files-header h3 {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }

  .files-panel .reset-btn {
    background: transparent;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 3px 9px;
    border-radius: 5px;
    cursor: pointer;
    display: none;
  }
  .files-panel .reset-btn.visible { display: inline-block; }
  .files-panel .reset-btn:hover { color: var(--text); border-color: var(--violet-bright); }

  .file-row {
    display: flex;
    gap: 12px;
    padding: 9px 0;
    border-top: 1px solid var(--border);
  }
  .file-row:first-child { border-top: none; }

  .file-row .node-tag {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--violet-bright);
    background: var(--violet-dim);
    padding: 2px 6px;
    border-radius: 4px;
    height: fit-content;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .file-row .file-info { flex: 1; min-width: 0; }
  .file-row .file-path { font-family: var(--font-mono); font-size: 12px; color: var(--mono); word-break: break-word; }
  .file-row .file-desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; line-height: 1.4; }

  .empty-files { color: var(--text-faint); font-size: 12px; font-style: italic; }

  footer.kbd-hint {
    position: fixed;
    bottom: 14px;
    right: 18px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 6px;
  }

  @media (max-width: 860px) {
    .body { flex-direction: column; }
    nav.rail { width: 100%; display: flex; overflow-x: auto; overflow-y: hidden; padding: 6px; }
    .rail-btn { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; }
    .rail-btn.active { border-bottom-color: var(--violet-bright); }
    main { padding: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">TMAR Ecosystem Navigator</span>

// ── Render ──────────────────────────────────────────────────────

let activeIdx = 0;

function buildClickDirectives(tabId) {
  const prefix = tabId + '__';
  return Object.keys(FILES)
    .filter(k => k.startsWith(prefix))
    .map(k => 'click ' + k.slice(prefix.length) + ' call navClick(' + JSON.stringify(tabId) + ',' + JSON.stringify(k.slice(prefix.length)) + ')')
    .join('\n');
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderFilesFor(tabId, nodeId) {
  const panel = document.getElementById('files-list-' + tabId);
  const resetBtn = document.getElementById('files-reset-' + tabId);
  if (!panel) return;
  let keys = Object.keys(FILES).filter(k => k.startsWith(tabId + '__'));
  if (nodeId) { keys = keys.filter(k => k === tabId + '__' + nodeId); resetBtn.classList.add('visible'); }
  else { resetBtn.classList.remove('visible'); }

  if (!keys.length) { panel.innerHTML = '<div class="empty-files">No linked files recorded for this node yet.</div>'; return; }

  panel.innerHTML = keys.map(k => {
    const nid = k.split('__')[1];
    return FILES[k].map(f =>
      '<div class="file-row"><span class="node-tag">' + escapeHtml(nid) + '</span><div class="file-info">' +
      '<div class="file-path">' + escapeHtml(f.path) + '</div>' +
      '<div class="file-desc">' + escapeHtml(f.desc) + '</div></div></div>'
    ).join('');
  }).join('');
}

window.navClick = function(tabId, nodeId) { renderFilesFor(tabId, nodeId); };

function buildUI() {
  const rail = document.getElementById('rail');
  const main = document.getElementById('main');

  TABS.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.className = 'rail-btn' + (i === 0 ? ' active' : '');
    btn.innerHTML = '<span class="glyph">' + tab.glyph + '</span>' + escapeHtml(tab.label);
    btn.onclick = () => showTab(i);
    rail.appendChild(btn);

    const panel = document.createElement('div');
    panel.className = 'panel' + (i === 0 ? ' active' : '');
    panel.id = 'panel-' + tab.id;
    panel.innerHTML =
      '<h1>' + escapeHtml(tab.title) + '</h1>' +
      '<p class="desc">' + escapeHtml(tab.desc) + '</p>' +
      '<div class="diagram-card"><div class="diagram-title">Architecture</div><pre class="mermaid" id="mmd-' + tab.id + '"></pre></div>' +
      '<div class="files-panel"><div class="files-header"><h3>Linked Files</h3><button class="reset-btn" id="files-reset-' + tab.id + '" onclick="renderFilesFor(' + JSON.stringify(tab.id) + ')">Show all</button></div><div id="files-list-' + tab.id + '"></div></div>';
    main.appendChild(panel);
  });

  renderActiveDiagram();
}

async function renderActiveDiagram() {
  const tab = TABS[activeIdx];
  const container = document.getElementById('mmd-' + tab.id);
  if (!container.dataset.rendered) {
    const src = tab.mermaid + '\n' + buildClickDirectives(tab.id);
    try {
      const { svg, bindFunctions } = await mermaid.render('svg-' + tab.id, src);
      container.innerHTML = svg;
      container.dataset.rendered = '1';
      if (bindFunctions) bindFunctions(container);
    } catch (e) {
      container.innerHTML = '<div style="color:var(--danger);font-family:var(--font-mono);font-size:12px">Diagram failed to render: ' + escapeHtml(e.message) + '</div>';
    }
  }
  renderFilesFor(tab.id);
}

function showTab(idx) {
  activeIdx = idx;
  document.querySelectorAll('.rail-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  renderActiveDiagram();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && activeIdx < TABS.length - 1) showTab(activeIdx + 1);
  if (e.key === 'ArrowLeft' && activeIdx > 0) showTab(activeIdx - 1);
});

buildUI();
</script>
